<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Основа</title>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #ffffff;
  }

  .grid-container {
    display: grid;
    grid-template-columns: 4fr 2fr 6fr 3fr;
    grid-template-rows: 90px 90px 190px 40px;
    gap: 8px;
    padding: 8px;
    background-color: #f4f4f4;
    width: 90%;
    max-width: 800px;
  }

  .item4 { grid-column: 4 / 5; grid-row: 4; background-color: #4D96FF; }
  .item5 { grid-column: 1 / 2; grid-row: 3; background-color: #FFB6B9; }
  .item6 { grid-column: 1 / 3; grid-row: 1; background-color: #A1E8AF; }
  .item7 { grid-column: 3 / 4; grid-row: 1; background-color: #FFE156; }
  .item8 { grid-column: 1 / 4; grid-row: 2; background-color: #FF9F1C; }

  .grid-item {
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 15px;
    font-weight: bold;
    border-radius: 5px;
  }
</style>
</head>
<body>

<div class="grid-container">
  <div class="grid-item item4">Футер</div>
  <div class="grid-item item5">Большой блок</div>
  <div class="grid-item item6">Широкий блок</div>
  <div class="grid-item item7">Во всю ширину</div>
  <div class="grid-item item8">Нижний блок</div>
</div>

</body>
</html>
