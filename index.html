<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лабораторная №6 Верстка Grid</title>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
}

/* Контейнер сетки: 6 равных колонок */
.grid-container {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-areas:
        "wide wide wide full full full"
        "bottom bottom bottom bottom bottom bottom"
        "big big . . . ."
        ". . . . footer footer";
    gap: 10px;
    width: 90%;
    max-width: 1200px;
}

/* Цветные элементы сетки с именованными областями */
.item4 { grid-area: footer;  background-color: #4D96FF; }  /* Футер — 2 колонки справа внизу */
.item5 { grid-area: big;     background-color: #FFB6B9; }  /* Большой блок — 2 колонки */
.item6 { grid-area: wide;    background-color: #A1E8AF; }  /* Широкий блок — 3 колонки */
.item7 { grid-area: full;    background-color: #FFE156; }  /* Во всю ширину — 3 колонки */
.item8 { grid-area: bottom;  background-color: #FF9F1C; }  /* Нижний блок — все 6 колонок */

/* Оформление элементов сетки */
.grid-item {
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5em;
    font-weight: bold;
    border-radius: 8px;
    padding: 20px;
}
</style>
<base target="_blank">
</head>
<body>
<div class="grid-container">
    <div class="grid-item item4">Футер</div>
    <div class="grid-item item5">Большой блок</div>
    <div class="grid-item item6">Широкий блок</div>
    <div class="grid-item item7">Во всю ширину</div>
    <div class="grid-item item8">Нижний блок</div>
</div>
</body>
</html>
